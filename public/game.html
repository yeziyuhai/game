<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="screen-orientation" content="landscape">
    <meta name="x5-orientation" content="landscape">
    <meta name="full-screen" content="yes">
    <title>混乱大枪战 - 对战</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
        
        body { 
            background: #0a0f1e; 
            overflow: hidden; 
            position: fixed; 
            width: 100%; 
            height: 100%;
        }
        
        /* 游戏容器 - 固定尺寸居中 */
        .game-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1a2a3a;
        }
        
        #gameCanvas { 
            width: auto;
            height: 100%;
            max-width: 100%;
            background: linear-gradient(180deg, #1a2a3a, #0f1a24);
            display: block;
        }
        
        /* 游戏固定尺寸 750x650 */
        .game-container {
            position: relative;
            width: 750px;
            height: 650px;
            margin: 0 auto;
        }
        
        /* 缩放适配手机屏幕 */
        @media (max-width: 800px) {
            .game-container {
                transform: scale(0.95);
            }
        }
        @media (max-width: 750px) {
            .game-container {
                transform: scale(0.9);
            }
        }
        @media (max-width: 700px) {
            .game-container {
                transform: scale(0.85);
            }
        }
        @media (max-width: 650px) {
            .game-container {
                transform: scale(0.8);
            }
        }
        
        .health-bars {
            position: absolute;
            top: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            color: white;
            font-weight: bold;
            font-size: 14px;
            text-shadow: 1px 1px 0 black;
            z-index: 10;
            pointer-events: none;
        }
        
        /* 方向按钮区域 */
        .controls {
            position: absolute;
            bottom: 15px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            padding: 0 15px;
            pointer-events: none;
            z-index: 10;
        }
        
        /* 左边方向按钮 十字键 */
        .direction-pad {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            pointer-events: auto;
            background: rgba(0,0,0,0.5);
            border-radius: 20px;
            padding: 12px;
        }
        
        .direction-row {
            display: flex;
            gap: 12px;
            justify-content: center;
        }
        
        .dir-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(0,0,0,0.7);
            border: 2px solid rgba(255,255,255,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: 0.05s;
            box-shadow: 0 3px 5px rgba(0,0,0,0.3);
        }
        
        .dir-btn:active {
            transform: scale(0.92);
            background: rgba(255,255,255,0.3);
        }
        
        /* 右边按钮 */
        .right-buttons {
            display: flex;
            gap: 15px;
            pointer-events: auto;
        }
        
        .action-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: rgba(0,0,0,0.7);
            border: 3px solid rgba(255,255,255,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            cursor: pointer;
            transition: 0.05s;
            box-shadow: 0 3px 5px rgba(0,0,0,0.3);
        }
        
        .action-btn:active {
            transform: scale(0.92);
            background: rgba(255,255,255,0.3);
        }
        
        .result-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        
        .result-card {
            background: rgba(0,0,0,0.95);
            border-radius: 48px;
            padding: 35px;
            text-align: center;
            border: 2px solid gold;
        }
        
        .result-card h1 { font-size: 28px; margin-bottom: 15px; }
        .result-btn {
            background: #5f27cd;
            border: none;
            padding: 12px 30px;
            border-radius: 40px;
            font-size: 16px;
            color: white;
            margin-top: 20px;
            cursor: pointer;
        }
        
        /* 提示文字 */
        .tip {
            position: absolute;
            bottom: 5px;
            left: 0;
            right: 0;
            text-align: center;
            color: rgba(255,255,255,0.4);
            font-size: 10px;
            pointer-events: none;
        }
    </style>
</head>
<body>
<div class="game-wrapper">
    <div class="game-container">
        <canvas id="gameCanvas" width="750" height="650"></canvas>

        <div class="health-bars">
            <div>🔵 蓝方 ❤️<span id="blueLives">3</span> HP:<span id="blueHp">30</span></div>
            <div>🔴 红方 ❤️<span id="redLives">3</span> HP:<span id="redHp">30</span></div>
        </div>

        <div class="controls">
            <!-- 左边：十字方向键 -->
            <div class="direction-pad">
                <div class="direction-row">
                    <div class="dir-btn" id="btnUp">⬆️</div>
                </div>
                <div class="direction-row">
                    <div class="dir-btn" id="btnLeft">⬅️</div>
                    <div class="dir-btn" id="btnDown">⬇️</div>
                    <div class="dir-btn" id="btnRight">➡️</div>
                </div>
            </div>
            
            <!-- 右边：射击 + 跳跃 -->
            <div class="right-buttons">
                <div class="action-btn" id="shootBtn">🔫</div>
                <div class="action-btn" id="jumpBtn">🦘</div>
            </div>
        </div>
        <div class="tip">上下移动平台 | 左右移动 | 射击击败对手</div>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/shared/constants.js"></script>
<script src="/js/player.js"></script>
<script src="/js/bullet.js"></script>
<script src="/js/platform.js"></script>
<script src="/js/controls.js"></script>
<script src="/js/network.js"></script>
<script src="/js/renderer.js"></script>
<script src="/js/gameLogic.js"></script>
<script src="/js/main.js"></script>
</body>
</html>
