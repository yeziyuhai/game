
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>混乱大枪战 - 对战</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
        body { background: #0a0f1e; overflow: hidden; position: fixed; width: 100%; height: 100%; }
        #gameCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        
        .health-bars {
            position: absolute;
            top: 20px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            color: white;
            font-weight: bold;
            font-size: 1rem;
            text-shadow: 1px 1px 0 black;
            z-index: 10;
            pointer-events: none;
        }
        
        .controls {
            position: absolute;
            bottom: 30px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            pointer-events: none;
            z-index: 10;
        }
        
        .joystick-area {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(0,0,0,0.4);
            border: 2px solid rgba(255,255,255,0.3);
            pointer-events: auto;
            position: relative;
        }
        
        .joystick-knob {
            position: absolute;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255,255,255,0.6);
            top: 35px;
            left: 35px;
            transition: 0.02s;
        }
        
        .right-buttons {
            display: flex;
            gap: 20px;
            pointer-events: auto;
        }
        
        .action-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: rgba(0,0,0,0.6);
            border: 3px solid white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            cursor: pointer;
        }
        .action-btn:active { transform: scale(0.95); background: rgba(255,255,255,0.3); }
        
        .result-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .result-card {
            background: rgba(0,0,0,0.95);
            border-radius: 48px;
            padding: 40px;
            text-align: center;
            border: 2px solid gold;
        }
        .result-btn {
            background: #5f27cd;
            border: none;
            padding: 12px 30px;
            border-radius: 40px;
            font-size: 1.2rem;
            color: white;
            margin-top: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>
<canvas id="gameCanvas"></canvas>

<div class="health-bars">
    <div>🔵 蓝方 ❤️<span id="blueLives">3</span> HP:<span id="blueHp">30</span></div>
    <div>🔴 红方 ❤️<span id="redLives">3</span> HP:<span id="redHp">30</span></div>
</div>

<div class="controls">
    <div class="joystick-area" id="joystickArea">
        <div class="joystick-knob" id="joystickKnob"></div>
    </div>
    <div class="right-buttons">
        <div class="action-btn" id="shootBtn">🔫</div>
        <div class="action-btn" id="jumpBtn">🦘</div>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/shared/constants.js"></script>
<script src="/js/player.js"></script>
<script src="/js/bullet.js"></script>
<script src="/js/controls.js"></script>
<script src="/js/network.js"></script>
<script src="/js/renderer.js"></script>
<script src="/js/gameLogic.js"></script>
<script src="/js/main.js"></script>
</body>
</html>
