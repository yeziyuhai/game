<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="screen-orientation" content="landscape">
    <meta name="x5-orientation" content="landscape">
    <meta name="full-screen" content="yes">
    <title>混乱大枪战 - 对战</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
        
        body { 
            background: #0a0f1e; 
            overflow: hidden; 
            position: fixed; 
            width: 100%; 
            height: 100%;
        }
        
        /* 强制横屏容器 */
        .landscape-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vh;
            height: 100vw;
            transform-origin: top left;
            transform: rotate(90deg) translateY(-100%);
        }
        
        @media (orientation: landscape) {
            .landscape-container {
                width: 100vw;
                height: 100vh;
                transform: rotate(0deg) translateY(0);
            }
        }
        
        #gameCanvas { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            background: linear-gradient(180deg, #1a2a3a, #0f1a24);
        }
        
        .health-bars {
            position: absolute;
            top: 15px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            color: white;
            font-weight: bold;
            font-size: 0.9rem;
            text-shadow: 1px 1px 0 black;
            z-index: 10;
            pointer-events: none;
        }
        
        .controls {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            padding: 0 15px;
            pointer-events: none;
            z-index: 10;
        }
        
        .joystick-area {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: rgba(0,0,0,0.5);
            border: 2px solid rgba(255,255,255,0.4);
            pointer-events: auto;
            position: relative;
        }
        
        .joystick-knob {
            position: absolute;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: rgba(255,255,255,0.7);
            top: 32.5px;
            left: 32.5px;
            transition: 0.02s;
        }
        
        .right-buttons {
            display: flex;
            gap: 15px;
            pointer-events: auto;
        }
        
        .action-btn {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: rgba(0,0,0,0.6);
            border: 3px solid rgba(255,255,255,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            cursor: pointer;
            transition: 0.05s;
        }
        .action-btn:active { transform: scale(0.92); background: rgba(255,255,255,0.3); }
        
        .result-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .result-card {
            background: rgba(0,0,0,0.95);
            border-radius: 48px;
            padding: 35px;
            text-align: center;
            border: 2px solid gold;
        }
        .result-card h1 { font-size: 1.8rem; margin-bottom: 15px; }
        .result-btn {
            background: #5f27cd;
            border: none;
            padding: 12px 30px;
            border-radius: 40px;
            font-size: 1rem;
            color: white;
            margin-top: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="landscape-container">
    <canvas id="gameCanvas"></canvas>

    <div class="health-bars">
        <div>🔵 蓝方 ❤️<span id="blueLives">3</span> HP:<span id="blueHp">30</span></div>
        <div>🔴 红方 ❤️<span id="redLives">3</span> HP:<span id="redHp">30</span></div>
    </div>

    <div class="controls">
        <div class="joystick-area" id="joystickArea">
            <div class="joystick-knob" id="joystickKnob"></div>
        </div>
        <div class="right-buttons">
            <div class="action-btn" id="shootBtn">🔫</div>
            <div class="action-btn" id="jumpBtn">🦘</div>
        </div>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/shared/constants.js"></script>
<script src="/js/player.js"></script>
<script src="/js/bullet.js"></script>
<script src="/js/controls.js"></script>
<script src="/js/network.js"></script>
<script src="/js/renderer.js"></script>
<script src="/js/gameLogic.js"></script>
<script src="/js/main.js"></script>
</body>
</html>
