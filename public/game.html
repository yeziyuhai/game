<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>混乱大枪战 - 对战</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; }
        body {
            background: #0a0f1e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: system-ui, sans-serif;
            padding: 10px;
        }
        .game-wrapper {
            width: 100%;
            max-width: 450px;
            background: #1a2a3a;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .canvas-area {
            position: relative;
        }
        canvas {
            display: block;
            width: 100%;
            height: auto;
            background: linear-gradient(180deg, #1a2a3a, #0f1a24);
            touch-action: none;
        }
        .health-bars {
            position: absolute;
            top: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            padding: 0 15px;
            color: white;
            font-weight: bold;
            font-size: 12px;
            text-shadow: 1px 1px 0 black;
            z-index: 10;
            pointer-events: none;
        }
        .controls {
            background: rgba(0,0,0,0.85);
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }
        .dpad {
            display: flex;
            gap: 10px;
        }
        .dir-btn {
            width: 70px;
            height: 70px;
            border-radius: 16px;
            background: #2c3e4e;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            color: white;
            cursor: pointer;
            box-shadow: 0 4px 0 #1a1a2e;
            transition: 0.05s linear;
            touch-action: manipulation;
        }
        .dir-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #1a1a2e;
            background: #3a5a70;
        }
        .action-area {
            display: flex;
            gap: 12px;
        }
        .action-btn {
            width: 70px;
            height: 70px;
            border-radius: 35px;
            background: #2c3e4e;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            cursor: pointer;
            box-shadow: 0 4px 0 #1a1a2e;
            transition: 0.05s linear;
            touch-action: manipulation;
        }
        .action-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #1a1a2e;
            background: #3a5a70;
        }
        .shoot-btn { background: #c0392b; box-shadow: 0 4px 0 #7b241c; }
        .game-tip {
            background: #0f1a24;
            text-align: center;
            color: #8aaec0;
            font-size: 11px;
            padding: 8px;
            border-top: 1px solid #2c3e4e;
        }
        .result-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.92);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
        }
        .result-card {
            background: #1a1a2e;
            border-radius: 40px;
            padding: 30px;
            text-align: center;
            border: 2px solid #f1c40f;
        }
        .result-card h1 { font-size: 28px; margin-bottom: 16px; }
        .result-btn {
            background: #8e44ad;
            border: none;
            padding: 12px 28px;
            border-radius: 40px;
            font-size: 16px;
            color: white;
            margin-top: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="game-wrapper">
    <div class="canvas-area">
        <canvas id="gameCanvas" width="400" height="500"></canvas>
        <div class="health-bars">
            <div>🔵 蓝方 ❤️ <span id="blueLives">3</span> HP:<span id="blueHp">30</span></div>
            <div>🔴 红方 ❤️ <span id="redLives">3</span> HP:<span id="redHp">30</span></div>
        </div>
    </div>
    <div class="controls">
        <div class="dpad">
            <div class="dir-btn" id="btnLeft">◀</div>
            <div class="dir-btn" id="btnRight">▶</div>
            <div class="dir-btn" id="btnUp">▲</div>
            <div class="dir-btn" id="btnDown">▼</div>
        </div>
        <div class="action-area">
            <div class="action-btn shoot-btn" id="shootBtn">🔫</div>
            <div class="action-btn" id="jumpBtn">🦘</div>
        </div>
    </div>
    <div class="game-tip">◀▶左右移动 | ▲上台阶 | ▼下台阶 | 🔫射击 | 🦘跳跃</div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script>
    // ---------- 游戏配置 ----------
    const GAME_W = 400, GAME_H = 500;
    // 平台定义（y 坐标越小越高）
    const PLATFORMS = [
        { x: 0, y: 470, w: 400, h: 10 },    // 地面
        { x: 50, y: 400, w: 120, h: 10 },
        { x: 230, y: 400, w: 120, h: 10 },
        { x: 100, y: 330, w: 100, h: 10 },
        { x: 200, y: 330, w: 100, h: 10 },
        { x: 140, y: 260, w: 120, h: 10 },
        { x: 140, y: 190, w: 120, h: 10 }
    ];
    // 平台按 y 排序
    const SORTED_PLATFORMS = [...PLATFORMS].sort((a,b) => a.y - b.y);

    let socket = io();
    let myColor = null;
    let gameActive = true;

    let players = {
        blue: { x: 60, y: 440, hp: 30, lives: 3, color: 'blue', facingRight: true },
        red: { x: 310, y: 440, hp: 30, lives: 3, color: 'red', facingRight: false }
    };
    let bullets = [];

    // 移动标志（触摸持续）
    let leftPressed = false;
    let rightPressed = false;

    // DOM 元素
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const blueHpSpan = document.getElementById('blueHp');
    const blueLivesSpan = document.getElementById('blueLives');
    const redHpSpan = document.getElementById('redHp');
    const redLivesSpan = document.getElementById('redLives');

    // 辅助函数
    function updateUI() {
        if(players.blue) {
            blueHpSpan.textContent = players.blue.hp;
            blueLivesSpan.textContent = players.blue.lives;
        }
        if(players.red) {
            redHpSpan.textContent = players.red.hp;
            redLivesSpan.textContent = players.red.lives;
        }
    }

    // 获取当前站立平台Y坐标
    function getPlatformY(playerY) {
        for(let p of PLATFORMS) {
            if(playerY + 28 >= p.y && playerY + 28 <= p.y + 15) return p.y;
        }
        return 470;
    }

    // 上平台
    function jumpUp() {
        if(!gameActive || !myColor || !players[myColor]) return;
        const p = players[myColor];
        const currentY = getPlatformY(p.y);
        let upperY = null;
        for(let plat of SORTED_PLATFORMS) {
            if(plat.y < currentY) upperY = plat.y;
            else break;
        }
        if(upperY !== null) {
            p.y = upperY - 28;
            socket.emit('move_up', { y: p.y });
        }
    }

    // 下平台
    function jumpDown() {
        if(!gameActive || !myColor || !players[myColor]) return;
        const p = players[myColor];
        const currentY = getPlatformY(p.y);
        let lowerY = currentY;
        for(let plat of SORTED_PLATFORMS) {
            if(plat.y > currentY) { lowerY = plat.y; break; }
        }
        if(lowerY !== currentY) {
            p.y = lowerY - 28;
            socket.emit('move_down', { y: p.y });
        }
    }

    // 射击
    function shoot() {
        if(!gameActive || !myColor || !players[myColor]) return;
        const p = players[myColor];
        socket.emit('shoot', {
            x: p.x + 14,
            y: p.y + 14,
            dir: p.facingRight ? 1 : -1,
            owner: myColor
        });
    }

    // ---------- 绘图 ----------
    function drawPlatforms() {
        for(let p of PLATFORMS) {
            ctx.fillStyle = '#8B7355';
            ctx.fillRect(p.x, p.y, p.w, p.h);
            ctx.fillStyle = '#C4A882';
            ctx.fillRect(p.x+2, p.y-2, p.w-4, 3);
        }
    }

    function drawPlayer(p) {
        ctx.fillStyle = p.color === 'blue' ? '#4a90d9' : '#e74c3c';
        ctx.shadowBlur = 5;
        ctx.fillRect(p.x, p.y, 28, 28);
        ctx.shadowBlur = 0;
        // 眼睛
        ctx.fillStyle = 'white';
        let eyeX = p.facingRight ? p.x+20 : p.x+6;
        ctx.fillRect(eyeX-4, p.y+8, 6, 6);
        ctx.fillStyle = 'black';
        ctx.fillRect(eyeX-3, p.y+9, 4, 4);
        // 血条
        let hpPercent = p.hp/30;
        ctx.fillStyle = '#333';
        ctx.fillRect(p.x, p.y-8, 28, 4);
        ctx.fillStyle = p.color === 'blue' ? '#4a90d9' : '#e74c3c';
        ctx.fillRect(p.x, p.y-8, 28*hpPercent, 4);
        // 名字
        ctx.fillStyle = 'white';
        ctx.font = '10px system-ui';
        ctx.textAlign = 'center';
        ctx.fillText(p.color==='blue'?'蓝方':'红方', p.x+14, p.y-12);
    }

    function drawBullet(b) {
        ctx.fillStyle = '#ffd700';
        ctx.fillRect(b.x, b.y, 8, 4);
        ctx.fillStyle = '#ffaa00';
        ctx.fillRect(b.x + (b.dir>0?5:0), b.y, 3, 4);
    }

    function drawGame() {
        ctx.clearRect(0, 0, GAME_W, GAME_H);
        ctx.fillStyle = '#1a2a3a';
        ctx.fillRect(0, 0, GAME_W, GAME_H);
        drawPlatforms();
        for(let b of bullets) drawBullet(b);
        drawPlayer(players.blue);
        drawPlayer(players.red);
    }

    // ---------- 移动循环 ----------
    let lastSend = 0;
    function updateMovement() {
        if(!gameActive || !myColor || !players[myColor]) return;
        let moved = false;
        let p = players[myColor];
        if(leftPressed) { p.x -= 4; p.facingRight = false; moved = true; }
        if(rightPressed) { p.x += 4; p.facingRight = true; moved = true; }
        if(p.x < 10) p.x = 10;
        if(p.x + 28 > 390) p.x = 390 - 28;
        if(moved) {
            let now = Date.now();
            if(now - lastSend > 30) {
                lastSend = now;
                socket.emit('move', { x: p.x, facingRight: p.facingRight });
            }
        }
    }

    // ---------- Socket 事件 ----------
    socket.on('role_assign', (data) => { myColor = data.color; console.log('我的角色:', myColor); });
    socket.on('game_state', (state) => {
        if(state && state.players) {
            players = state.players;
            bullets = state.bullets || [];
            updateUI();
            drawGame();
        }
    });
    socket.on('game_over', (data) => {
        gameActive = false;
        let isWinner = (data.winner === myColor);
        let div = document.createElement('div');
        div.className = 'result-overlay';
        div.innerHTML = `
            <div class="result-card">
                <h1 style="color:${isWinner?'#ffd700':'#e74c3c'}">${isWinner?'🏆 胜利！ 🏆':'💀 失败... 💀'}</h1>
                <button class="result-btn" id="returnBtn">返回房间</button>
            </div>
        `;
        document.body.appendChild(div);
        document.getElementById('returnBtn').onclick = () => {
            socket.emit('return_to_room');
            window.location.href = '/';
        };
    });
    socket.on('redirect_to_room', () => { window.location.href = '/'; });

    // ---------- 按钮绑定（持续移动 + 点按跳跃）----------
    const btnLeft = document.getElementById('btnLeft');
    const btnRight = document.getElementById('btnRight');
    const btnUp = document.getElementById('btnUp');
    const btnDown = document.getElementById('btnDown');
    const shootBtn = document.getElementById('shootBtn');
    const jumpBtn = document.getElementById('jumpBtn');

    // 左右移动（触摸持续）
    btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); leftPressed = true; });
    btnLeft.addEventListener('touchend', (e) => { e.preventDefault(); leftPressed = false; });
    btnLeft.addEventListener('mousedown', () => { leftPressed = true; });
    btnLeft.addEventListener('mouseup', () => { leftPressed = false; });

    btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); rightPressed = true; });
    btnRight.addEventListener('touchend', (e) => { e.preventDefault(); rightPressed = false; });
    btnRight.addEventListener('mousedown', () => { rightPressed = true; });
    btnRight.addEventListener('mouseup', () => { rightPressed = false; });

    // 跳跃（上平台）
    btnUp.addEventListener('click', (e) => { e.preventDefault(); jumpUp(); });
    btnUp.addEventListener('touchstart', (e) => { e.preventDefault(); jumpUp(); });
    jumpBtn.addEventListener('click', (e) => { e.preventDefault(); jumpUp(); });
    jumpBtn.addEventListener('touchstart', (e) => { e.preventDefault(); jumpUp(); });

    // 下平台
    btnDown.addEventListener('click', (e) => { e.preventDefault(); jumpDown(); });
    btnDown.addEventListener('touchstart', (e) => { e.preventDefault(); jumpDown(); });

    // 射击
    shootBtn.addEventListener('click', (e) => { e.preventDefault(); shoot(); });
    shootBtn.addEventListener('touchstart', (e) => { e.preventDefault(); shoot(); });

    // 游戏循环
    function gameLoop() {
        updateMovement();
        drawGame();
        requestAnimationFrame(gameLoop);
    }
    gameLoop();
</script>
</body>
</html>
