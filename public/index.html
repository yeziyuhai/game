
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>混乱大枪战 - 房间</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0f1e; overflow: hidden; position: fixed; width: 100%; height: 100%; }
        #gameCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        
        .ui-overlay {
            position: absolute;
            bottom: 30px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 50px;
            z-index: 10;
        }
        
        button {
            background: #5f27cd;
            border: none;
            padding: 12px 30px;
            border-radius: 40px;
            font-size: 1.2rem;
            color: white;
            cursor: pointer;
        }
        .start-btn { background: #e67e22; }
        button:disabled { opacity: 0.5; }
        
        .room-panel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            border-radius: 48px;
            padding: 40px;
            text-align: center;
            z-index: 20;
            min-width: 300px;
        }
        
        h1 { color: #ffd700; margin-bottom: 30px; }
        .players { display: flex; gap: 40px; margin-bottom: 30px; }
        .player { padding: 15px 25px; background: rgba(255,255,255,0.1); border-radius: 20px; }
        .blue { color: #4a90d9; font-size: 1.5rem; }
        .red { color: #e74c3c; font-size: 1.5rem; }
        .ready { color: #27ae60; }
        .not-ready { color: #7f8c8d; }
        .waiting { color: #ffd700; margin-top: 20px; }
    </style>
</head>
<body>
<canvas id="gameCanvas"></canvas>

<div class="room-panel">
    <h1>🎮 混乱大枪战</h1>
    <div class="players">
        <div class="player">
            <div class="blue">🔵 蓝方</div>
            <div id="blueReady" class="not-ready">未准备</div>
        </div>
        <div class="player">
            <div class="red">🔴 红方</div>
            <div id="redReady" class="not-ready">未准备</div>
        </div>
    </div>
    <div class="ui-overlay" style="position: relative; bottom: auto; gap: 20px;">
        <button id="readyBtn">✅ 准备</button>
        <button id="startBtn" class="start-btn" disabled>🎯 开始游戏</button>
    </div>
    <div id="waiting" class="waiting">等待第二名玩家...</div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/shared/constants.js"></script>
<script src="/js/player.js"></script>
<script src="/js/bullet.js"></script>
<script src="/js/controls.js"></script>
<script src="/js/network.js"></script>
<script src="/js/renderer.js"></script>
<script src="/js/gameLogic.js"></script>
<script src="/js/main.js"></script>
</body>
</html>
