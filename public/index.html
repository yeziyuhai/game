<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <!-- 尝试强制横屏 -->
    <meta name="screen-orientation" content="landscape">
    <meta name="x5-orientation" content="landscape">
    <meta name="full-screen" content="yes">
    <title>混乱大枪战 - 房间</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background: #0a0f1e; 
            overflow: hidden; 
            position: fixed; 
            width: 100%; 
            height: 100%;
        }
        
        /* 强制横屏容器 - 旋转90度 */
        .landscape-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vh;  /* 宽度 = 屏幕高度 */
            height: 100vw; /* 高度 = 屏幕宽度 */
            transform-origin: top left;
            transform: rotate(90deg) translateY(-100%);
        }
        
        /* 针对不同屏幕方向的修正 */
        @media (orientation: landscape) {
            .landscape-container {
                width: 100vw;
                height: 100vh;
                transform: rotate(0deg) translateY(0);
            }
        }
        
        #gameCanvas { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
        }
        
        .room-panel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.85);
            border-radius: 48px;
            padding: 30px 50px;
            text-align: center;
            z-index: 20;
            min-width: 320px;
            backdrop-filter: blur(10px);
        }
        
        h1 { color: #ffd700; margin-bottom: 25px; font-size: 1.6rem; }
        .players { display: flex; gap: 40px; margin-bottom: 25px; }
        .player { padding: 15px 25px; background: rgba(255,255,255,0.1); border-radius: 20px; min-width: 120px; }
        .blue { color: #4a90d9; font-size: 1.3rem; font-weight: bold; }
        .red { color: #e74c3c; font-size: 1.3rem; font-weight: bold; }
        .ready-status { margin-top: 10px; font-size: 0.9rem; }
        .ready { color: #27ae60; }
        .not-ready { color: #7f8c8d; }
        
        button {
            background: #5f27cd;
            border: none;
            padding: 12px 30px;
            border-radius: 40px;
            font-size: 1.1rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
            margin: 10px 5px;
        }
        .start-btn { background: #e67e22; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .waiting { color: #ffd700; margin-top: 15px; font-size: 0.85rem; }
        
        /* 简单提示 */
        .tip {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            text-align: center;
            color: #888;
            font-size: 0.7rem;
            z-index: 20;
        }
    </style>
</head>
<body>
<div class="landscape-container">
    <canvas id="gameCanvas"></canvas>
    
    <div class="room-panel">
        <h1>🎮 混乱大枪战</h1>
        <div class="players">
            <div class="player">
                <div class="blue">🔵 蓝方</div>
                <div id="blueReady" class="ready-status not-ready">未准备</div>
            </div>
            <div class="player">
                <div class="red">🔴 红方</div>
                <div id="redReady" class="ready-status not-ready">未准备</div>
            </div>
        </div>
        <div>
            <button id="readyBtn">✅ 准备</button>
            <button id="startBtn" class="start-btn" disabled>🎯 开始游戏</button>
        </div>
        <div id="waiting" class="waiting">等待第二名玩家...</div>
    </div>
    <div class="tip">🎮 横屏游戏 | 等待对手加入</div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/shared/constants.js"></script>
<script src="/js/player.js"></script>
<script src="/js/bullet.js"></script>
<script src="/js/controls.js"></script>
<script src="/js/network.js"></script>
<script src="/js/renderer.js"></script>
<script src="/js/gameLogic.js"></script>
<script src="/js/main.js"></script>
</body>
</html>
