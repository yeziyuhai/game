<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>混乱大枪战 - 房间</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background: #0a0f1e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: system-ui, sans-serif;
            padding: 16px;
        }
        .room-container {
            width: 100%;
            max-width: 400px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 24px;
            text-align: center;
        }
        h1 { color: #ffd700; margin-bottom: 20px; font-size: 1.8rem; }
        .players {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 30px;
        }
        .player {
            background: rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: 16px 24px;
            text-align: center;
            min-width: 120px;
        }
        .blue { color: #4a90d9; font-size: 1.3rem; font-weight: bold; }
        .red { color: #e74c3c; font-size: 1.3rem; font-weight: bold; }
        .ready-status { margin-top: 10px; font-size: 0.9rem; }
        .ready { color: #27ae60; }
        .not-ready { color: #7f8c8d; }
        button {
            background: #5f27cd;
            border: none;
            padding: 12px 24px;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: bold;
            color: white;
            margin: 8px;
            cursor: pointer;
            width: 140px;
        }
        .start-btn { background: #e67e22; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .waiting { color: #ffd700; margin-top: 16px; font-size: 0.85rem; }
        .connection-status { color: #4ecdc4; margin-bottom: 16px; font-size: 0.8rem; }
    </style>
</head>
<body>
<div class="room-container">
    <h1>🎮 混乱大枪战</h1>
    <div class="connection-status" id="connectionStatus">🔄 连接中...</div>
    <div class="players">
        <div class="player">
            <div class="blue">🔵 蓝方</div>
            <div id="blueReady" class="ready-status not-ready">未准备</div>
        </div>
        <div class="player">
            <div class="red">🔴 红方</div>
            <div id="redReady" class="ready-status not-ready">未准备</div>
        </div>
    </div>
    <button id="readyBtn">✅ 准备</button>
    <button id="startBtn" class="start-btn" disabled>🎯 开始游戏</button>
    <div id="waiting" class="waiting">等待第二名玩家...</div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    let myColor = null;
    let isReady = false;

    const blueReadySpan = document.getElementById('blueReady');
    const redReadySpan = document.getElementById('redReady');
    const readyBtn = document.getElementById('readyBtn');
    const startBtn = document.getElementById('startBtn');
    const waitingDiv = document.getElementById('waiting');
    const connectionStatus = document.getElementById('connectionStatus');

    socket.on('connect', () => {
        connectionStatus.innerHTML = '✅ 已连接';
    });

    socket.on('role_assign', (data) => {
        myColor = data.color;
        waitingDiv.innerHTML = `你是 ${myColor === 'blue' ? '🔵 蓝方' : '🔴 红方'}`;
    });

    socket.on('room_state', (state) => {
        blueReadySpan.innerHTML = state.blueReady ? '✓ 已准备' : '未准备';
        blueReadySpan.className = state.blueReady ? 'ready-status ready' : 'ready-status not-ready';
        redReadySpan.innerHTML = state.redReady ? '✓ 已准备' : '未准备';
        redReadySpan.className = state.redReady ? 'ready-status ready' : 'ready-status not-ready';

        if (state.blueReady && state.redReady) {
            waitingDiv.innerHTML = '两人都已准备！';
            if (myColor === 'blue') startBtn.disabled = false;
        } else {
            startBtn.disabled = true;
            if (!state.blueConnected || !state.redConnected) waitingDiv.innerHTML = '等待第二名玩家...';
            else waitingDiv.innerHTML = '等待双方准备...';
        }
    });

    socket.on('game_start', () => {
        window.location.href = '/game.html';
    });

    readyBtn.onclick = () => {
        if (!isReady) {
            isReady = true;
            socket.emit('player_ready');
            readyBtn.innerHTML = '✅ 已准备';
            readyBtn.style.background = '#27ae60';
        }
    };

    startBtn.onclick = () => {
        if (myColor === 'blue') socket.emit('start_game');
    };
</script>
</body>
</html>
