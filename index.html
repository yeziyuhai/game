<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>混乱大枪战 - 房间</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        .room-container {
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            border-radius: 48px;
            padding: 30px;
            text-align: center;
            min-width: 300px;
        }

        h1 {
            color: #ffd700;
            margin-bottom: 30px;
            font-size: 2rem;
        }

        .players {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 30px;
        }

        .player-slot {
            background: rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: 20px 30px;
            text-align: center;
        }

        .player-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin: 0 auto 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
        }

        .player-avatar.blue {
            background: linear-gradient(135deg, #4a90d9, #2c5aa0);
            box-shadow: 0 0 20px rgba(74,144,217,0.5);
        }

        .player-avatar.red {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            box-shadow: 0 0 20px rgba(231,76,60,0.5);
        }

        .player-name {
            color: white;
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .ready-status {
            font-size: 0.9rem;
            padding: 5px 12px;
            border-radius: 20px;
            background: rgba(0,0,0,0.5);
        }

        .ready-status.ready {
            background: #27ae60;
            color: white;
        }

        .ready-status.not-ready {
            background: #7f8c8d;
            color: #ddd;
        }

        .ready-btn, .start-btn {
            background: linear-gradient(135deg, #5f27cd, #341f97);
            border: none;
            padding: 12px 30px;
            border-radius: 40px;
            font-size: 1.2rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
            margin: 10px;
            transition: all 0.1s;
        }

        .ready-btn:active, .start-btn:active {
            transform: scale(0.98);
        }

        .ready-btn.ready {
            background: linear-gradient(135deg, #27ae60, #1e8449);
        }

        .start-btn {
            background: linear-gradient(135deg, #e67e22, #d35400);
        }

        .start-btn:disabled {
            opacity: 0.5;
            transform: none;
        }

        .waiting-text {
            color: #ffd700;
            margin-top: 20px;
            font-size: 0.9rem;
        }

        .connection-status {
            color: #4ecdc4;
            margin-bottom: 20px;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
<div class="room-container">
    <h1>🎮 混乱大枪战</h1>
    <div class="connection-status" id="connectionStatus">🔄 连接中...</div>

    <div class="players">
        <div class="player-slot" id="p1Slot">
            <div class="player-avatar blue">🔵</div>
            <div class="player-name">蓝方玩家</div>
            <div class="ready-status not-ready" id="p1Ready">未准备</div>
        </div>
        <div class="player-slot" id="p2Slot">
            <div class="player-avatar red">🔴</div>
            <div class="player-name">红方玩家</div>
            <div class="ready-status not-ready" id="p2Ready">未准备</div>
        </div>
    </div>

    <button class="ready-btn" id="readyBtn">✅ 准备</button>
    <button class="start-btn" id="startBtn" disabled>🎯 开始游戏</button>
    <div class="waiting-text" id="waitingText">等待第二名玩家加入...</div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    
    let myColor = null;
    let isReady = false;
    let bothPlayersReady = false;
    
    const p1ReadySpan = document.getElementById('p1Ready');
    const p2ReadySpan = document.getElementById('p2Ready');
    const readyBtn = document.getElementById('readyBtn');
    const startBtn = document.getElementById('startBtn');
    const connectionStatus = document.getElementById('connectionStatus');
    const waitingText = document.getElementById('waitingText');
    
    // 更新UI
    function updateUI(state) {
        if (state.p1Ready) {
            p1ReadySpan.textContent = '✓ 已准备';
            p1ReadySpan.className = 'ready-status ready';
        } else {
            p1ReadySpan.textContent = '未准备';
            p1ReadySpan.className = 'ready-status not-ready';
        }
        
        if (state.p2Ready) {
            p2ReadySpan.textContent = '✓ 已准备';
            p2ReadySpan.className = 'ready-status ready';
        } else {
            p2ReadySpan.textContent = '未准备';
            p2ReadySpan.className = 'ready-status not-ready';
        }
        
        bothPlayersReady = state.p1Ready && state.p2Ready;
        
        if (myColor === 'blue' && bothPlayersReady) {
            startBtn.disabled = false;
        } else {
            startBtn.disabled = true;
        }
        
        if (state.p1Connected && state.p2Connected) {
            waitingText.textContent = '两名玩家已就绪，准备开始！';
        } else {
            waitingText.textContent = '等待第二名玩家加入...';
        }
    }
    
    // Socket事件
    socket.on('connect', () => {
        connectionStatus.innerHTML = '✅ 已连接';
    });
    
    socket.on('role_assign', (data) => {
        myColor = data.color;
        connectionStatus.innerHTML = `你是 ${myColor === 'blue' ? '🔵 蓝方' : '🔴 红方'}`;
    });
    
    socket.on('room_state', (state) => {
        updateUI(state);
    });
    
    socket.on('game_start', () => {
        // 跳转到游戏页面
        window.location.href = '/game.html';
    });
    
    socket.on('waiting', () => {
        waitingText.textContent = '等待第二名玩家加入...';
    });
    
    // 准备按钮
    readyBtn.onclick = () => {
        if (!isReady) {
            isReady = true;
            socket.emit('player_ready');
            readyBtn.textContent = '✅ 已准备';
            readyBtn.classList.add('ready');
        }
    };
    
    // 开始按钮（只有蓝方可见）
    startBtn.onclick = () => {
        if (myColor === 'blue' && bothPlayersReady) {
            socket.emit('start_game');
        }
    };
</script>
</body>
</html>
