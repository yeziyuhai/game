<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>双人对战·回合传说</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
            padding: 20px;
        }

        .game-container {
            max-width: 600px;
            width: 100%;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 48px;
            padding: 20px;
            box-shadow: 0 25px 45px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2);
        }

        /* 玩家信息区 */
        .players {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 25px;
        }

        .player-card {
            flex: 1;
            background: rgba(0,0,0,0.5);
            border-radius: 32px;
            padding: 20px 15px;
            text-align: center;
            backdrop-filter: blur(5px);
            transition: all 0.3s;
        }

        .player-card.p1 {
            border: 2px solid #ff6b6b;
            box-shadow: 0 0 15px rgba(255,107,107,0.3);
        }

        .player-card.p2 {
            border: 2px solid #4ecdc4;
            box-shadow: 0 0 15px rgba(78,205,196,0.3);
        }

        .player-card.current-turn {
            transform: scale(1.02);
            background: rgba(255,215,0,0.2);
            box-shadow: 0 0 25px gold;
        }

        .player-name {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .p1 .player-name { color: #ff6b6b; }
        .p2 .player-name { color: #4ecdc4; }

        .player-hp {
            font-size: 2rem;
            font-weight: bold;
            color: white;
            margin: 10px 0;
        }

        .hp-bar {
            background: #333;
            border-radius: 20px;
            height: 12px;
            overflow: hidden;
            margin: 10px 0;
        }

        .hp-fill {
            height: 100%;
            transition: width 0.3s ease;
            border-radius: 20px;
        }

        .p1 .hp-fill { background: linear-gradient(90deg, #ff6b6b, #ff4757); }
        .p2 .hp-fill { background: linear-gradient(90deg, #4ecdc4, #45b7d1); }

        .player-status {
            font-size: 0.85rem;
            color: #aaa;
            margin-top: 8px;
        }

        /* 战斗日志 */
        .battle-log {
            background: rgba(0,0,0,0.6);
            border-radius: 24px;
            height: 200px;
            overflow-y: auto;
            padding: 15px;
            margin: 20px 0;
            font-size: 0.85rem;
        }

        .log-entry {
            padding: 6px 10px;
            margin: 4px 0;
            border-left: 3px solid;
            border-radius: 8px;
            animation: fadeIn 0.3s;
        }

        .log-entry.attack { border-left-color: #ff6b6b; color: #ffaaaa; }
        .log-entry.heal { border-left-color: #51cf66; color: #b2f2bb; }
        .log-entry.critical { border-left-color: #ffd43b; color: #ffd43b; font-weight: bold; }
        .log-entry.system { border-left-color: #868e96; color: #adb5bd; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* 行动按钮 */
        .action-buttons {
            display: flex;
            gap: 12px;
            margin-bottom: 15px;
        }

        .action-btn {
            flex: 1;
            background: linear-gradient(135deg, #2c3e50, #1a1a2e);
            border: none;
            padding: 14px;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: all 0.1s;
            box-shadow: 0 4px 0 #0f0f1a;
        }

        .action-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #0f0f1a;
        }

        .action-btn.attack { background: linear-gradient(135deg, #e74c3c, #c0392b); }
        .action-btn.heal { background: linear-gradient(135deg, #27ae60, #1e8449); }
        .action-btn:disabled {
            opacity: 0.5;
            transform: none;
            cursor: not-allowed;
        }

        .waiting-text {
            text-align: center;
            color: #ffd43b;
            padding: 15px;
            font-size: 0.9rem;
        }

        .reset-btn {
            width: 100%;
            background: linear-gradient(135deg, #5f27cd, #341f97);
            padding: 12px;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: bold;
            color: white;
            border: none;
            cursor: pointer;
            margin-top: 10px;
        }

        .connection-status {
            text-align: center;
            font-size: 0.75rem;
            color: #4ecdc4;
            margin-bottom: 15px;
            padding: 5px;
            background: rgba(0,0,0,0.4);
            border-radius: 20px;
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="connection-status" id="connectionStatus">🔄 连接中...</div>

    <div class="players">
        <div class="player-card p1" id="player1Card">
            <div class="player-name">🌸 花见</div>
            <div class="player-hp"><span id="p1Hp">100</span> / 100</div>
            <div class="hp-bar"><div class="hp-fill" id="p1HpFill" style="width: 100%"></div></div>
            <div class="player-status" id="p1Status">等待...</div>
        </div>
        <div class="player-card p2" id="player2Card">
            <div class="player-name">❄️ 雪风</div>
            <div class="player-hp"><span id="p2Hp">100</span> / 100</div>
            <div class="hp-bar"><div class="hp-fill" id="p2HpFill" style="width: 100%"></div></div>
            <div class="player-status" id="p2Status">等待...</div>
        </div>
    </div>

    <div class="battle-log" id="battleLog">
        <div class="log-entry system">✨ 等待两名玩家连接...</div>
    </div>

    <div class="action-buttons">
        <button class="action-btn attack" id="attackBtn" disabled>⚔️ 攻击</button>
        <button class="action-btn heal" id="healBtn" disabled>💚 治疗</button>
    </div>

    <button class="reset-btn" id="resetBtn">🔄 重置对局</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    
    // DOM 元素
    const p1HpSpan = document.getElementById('p1Hp');
    const p2HpSpan = document.getElementById('p2Hp');
    const p1HpFill = document.getElementById('p1HpFill');
    const p2HpFill = document.getElementById('p2HpFill');
    const p1Status = document.getElementById('p1Status');
    const p2Status = document.getElementById('p2Status');
    const attackBtn = document.getElementById('attackBtn');
    const healBtn = document.getElementById('healBtn');
    const resetBtn = document.getElementById('resetBtn');
    const connectionStatus = document.getElementById('connectionStatus');
    const battleLog = document.getElementById('battleLog');
    const player1Card = document.getElementById('player1Card');
    const player2Card = document.getElementById('player2Card');

    let myRole = null; // 'p1' 或 'p2'
    let gameState = {
        p1: { hp: 100, maxHp: 100, name: '花见' },
        p2: { hp: 100, maxHp: 100, name: '雪风' },
        currentTurn: 'p1',
        gameActive: true,
        waitingForAction: false
    };

    // 添加日志
    function addLog(message, type = 'system') {
        const logDiv = document.createElement('div');
        logDiv.className = `log-entry ${type}`;
        logDiv.innerHTML = message;
        battleLog.appendChild(logDiv);
        logDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        // 保留最近50条
        while(battleLog.children.length > 50) battleLog.removeChild(battleLog.firstChild);
    }

    // 更新UI
    function updateUI() {
        // 更新血量显示
        p1HpSpan.textContent = gameState.p1.hp;
        p2HpSpan.textContent = gameState.p2.hp;
        const p1Percent = (gameState.p1.hp / gameState.p1.maxHp) * 100;
        const p2Percent = (gameState.p2.hp / gameState.p2.maxHp) * 100;
        p1HpFill.style.width = `${Math.max(0, p1Percent)}%`;
        p2HpFill.style.width = `${Math.max(0, p2Percent)}%`;

        // 更新回合高亮
        if (gameState.currentTurn === 'p1') {
            player1Card.classList.add('current-turn');
            player2Card.classList.remove('current-turn');
        } else {
            player2Card.classList.add('current-turn');
            player1Card.classList.remove('current-turn');
        }

        // 更新按钮状态
        const isMyTurn = (myRole === gameState.currentTurn);
        const gameActive = gameState.gameActive;
        
        if (!gameActive) {
            attackBtn.disabled = true;
            healBtn.disabled = true;
        } else if (isMyTurn && !gameState.waitingForAction) {
            attackBtn.disabled = false;
            healBtn.disabled = false;
        } else {
            attackBtn.disabled = true;
            healBtn.disabled = true;
        }

        // 更新状态文字
        if (!gameState.gameActive) {
            const winner = gameState.p1.hp <= 0 ? '❄️ 雪风' : '🌸 花见';
            p1Status.textContent = gameState.p1.hp <= 0 ? '💀 败北' : (gameState.p2.hp <= 0 ? '🏆 胜利' : '');
            p2Status.textContent = gameState.p2.hp <= 0 ? '💀 败北' : (gameState.p1.hp <= 0 ? '🏆 胜利' : '');
        } else {
            p1Status.textContent = gameState.currentTurn === 'p1' ? '⚡ 回合中' : '等待中';
            p2Status.textContent = gameState.currentTurn === 'p2' ? '⚡ 回合中' : '等待中';
        }
    }

    // 执行攻击
    function doAttack() {
        if (!gameState.gameActive) return;
        if (gameState.waitingForAction) return;
        if (myRole !== gameState.currentTurn) return;

        const attacker = gameState.currentTurn;
        const defender = attacker === 'p1' ? 'p2' : 'p1';
        
        // 基础伤害 15-25
        let damage = Math.floor(Math.random() * 15) + 15;
        let isCritical = Math.random() < 0.2; // 20%暴击
        
        if (isCritical) {
            damage = Math.floor(damage * 1.5);
            addLog(`✨ 暴击！${damage} 点伤害！ ✨`, 'critical');
        }
        
        gameState[defender].hp = Math.max(0, gameState[defender].hp - damage);
        
        const attackerName = gameState[attacker].name;
        const defenderName = gameState[defender].name;
        addLog(`⚔️ ${attackerName} 攻击 ${defenderName}，造成 ${damage} 点伤害！`, 'attack');
        
        updateUI();
        
        // 检查胜负
        if (gameState[defender].hp <= 0) {
            gameState.gameActive = false;
            addLog(`🎉 ${attackerName} 获得胜利！ 🎉`, 'system');
            updateUI();
            socket.emit('game_action', { type: 'game_over', winner: attacker });
            return;
        }
        
        // 切换回合
        gameState.currentTurn = defender;
        gameState.waitingForAction = false;
        updateUI();
        
        // 通知服务器
        socket.emit('game_action', {
            type: 'attack',
            attacker: attacker,
            defender: defender,
            damage: damage,
            isCritical: isCritical,
            newHp: gameState[defender].hp,
            currentTurn: gameState.currentTurn,
            gameActive: gameState.gameActive
        });
        
        addLog(`🔄 轮到 ${gameState[defender].name} 行动`, 'system');
    }
    
    // 执行治疗
    function doHeal() {
        if (!gameState.gameActive) return;
        if (gameState.waitingForAction) return;
        if (myRole !== gameState.currentTurn) return;
        
        const healer = gameState.currentTurn;
        let healAmount = Math.floor(Math.random() * 20) + 15;
        const oldHp = gameState[healer].hp;
        gameState[healer].hp = Math.min(gameState[healer].maxHp, gameState[healer].hp + healAmount);
        const actualHeal = gameState[healer].hp - oldHp;
        
        addLog(`💚 ${gameState[healer].name} 治疗了 ${actualHeal} 点生命值！`, 'heal');
        updateUI();
        
        // 切换回合
        const defender = healer === 'p1' ? 'p2' : 'p1';
        gameState.currentTurn = defender;
        gameState.waitingForAction = false;
        updateUI();
        
        socket.emit('game_action', {
            type: 'heal',
            player: healer,
            healAmount: actualHeal,
            newHp: gameState[healer].hp,
            currentTurn: gameState.currentTurn,
            gameActive: gameState.gameActive
        });
        
        addLog(`🔄 轮到 ${gameState[defender].name} 行动`, 'system');
    }
    
    // 重置游戏
    function resetGame() {
        gameState = {
            p1: { hp: 100, maxHp: 100, name: '花见' },
            p2: { hp: 100, maxHp: 100, name: '雪风' },
            currentTurn: 'p1',
            gameActive: true,
            waitingForAction: false
        };
        updateUI();
        addLog('✨ 对局已重置！新的回合开始！ ✨', 'system');
        socket.emit('game_action', { type: 'reset' });
    }
    
    // Socket 事件
    socket.on('connect', () => {
        connectionStatus.innerHTML = '✅ 已连接，等待对手...';
        connectionStatus.style.color = '#4ecdc4';
    });
    
    socket.on('role_assign', (data) => {
        myRole = data.role;
        connectionStatus.innerHTML = `🎮 已加入对局！你是 ${myRole === 'p1' ? '🌸 花见' : '❄️ 雪风'}`;
        addLog(`✨ ${myRole === 'p1' ? '花见' : '雪风'} 加入了战斗！`, 'system');
    });
    
    socket.on('game_state_sync', (state) => {
        gameState = state;
        updateUI();
    });
    
    socket.on('opponent_action', (data) => {
        gameState = data.gameState;
        updateUI();
    });
    
    socket.on('players_ready', () => {
        addLog('🎌 两名玩家已就绪！对局开始！', 'system');
        connectionStatus.innerHTML = '🎌 对局进行中...';
    });
    
    socket.on('waiting_for_player', () => {
        connectionStatus.innerHTML = '⏳ 等待第二名玩家加入...';
        addLog('⏳ 等待对手加入...', 'system');
    });
    
    // 按钮事件
    attackBtn.onclick = doAttack;
    healBtn.onclick = doHeal;
    resetBtn.onclick = resetGame;
</script>
</body>
</html>
