<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>混乱大枪战 - 对战</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            touch-action: none;
        }

        body {
            background: #0a0f1e;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
        }

        /* 游戏画布 */
        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #1a2a3a 0%, #0f1a24 100%);
            display: block;
        }

        /* UI层 */
        .ui-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px;
            pointer-events: none;
        }

        /* 左摇杆区域 */
        .joystick-area {
            position: absolute;
            bottom: 80px;
            left: 80px;
            width: 140px;
            height: 140px;
            pointer-events: auto;
        }

        /* 右按钮区域 */
        .right-buttons {
            position: absolute;
            bottom: 80px;
            right: 30px;
            display: flex;
            gap: 20px;
            pointer-events: auto;
        }

        .action-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: rgba(0,0,0,0.6);
            border: 3px solid rgba(255,255,255,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            cursor: pointer;
            transition: all 0.05s;
            backdrop-filter: blur(5px);
        }

        .action-btn:active {
            transform: scale(0.95);
            background: rgba(255,255,255,0.3);
        }

        /* 血条 */
        .health-bars {
            position: absolute;
            top: 20px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            pointer-events: none;
        }

        .health-item {
            background: rgba(0,0,0,0.6);
            border-radius: 20px;
            padding: 8px 16px;
            text-align: center;
            min-width: 120px;
        }

        .health-name {
            font-size: 0.9rem;
            color: white;
            margin-bottom: 5px;
        }

        .health-bar-bg {
            background: #333;
            border-radius: 10px;
            height: 12px;
            overflow: hidden;
        }

        .health-bar-fill {
            height: 100%;
            transition: width 0.2s;
            border-radius: 10px;
        }

        .blue-fill { background: linear-gradient(90deg, #4a90d9, #2c5aa0); }
        .red-fill { background: linear-gradient(90deg, #e74c3c, #c0392b); }

        .health-lives {
            font-size: 0.7rem;
            color: #ffd700;
            margin-top: 4px;
        }

        /* 结算界面 */
        .result-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            pointer-events: auto;
        }

        .result-card {
            background: rgba(0,0,0,0.9);
            border-radius: 48px;
            padding: 40px;
            text-align: center;
            border: 2px solid gold;
        }

        .result-card h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        .result-card .winner {
            color: #ffd700;
        }

        .result-card .loser {
            color: #e74c3c;
        }

        .result-btn {
            background: #5f27cd;
            border: none;
            padding: 12px 30px;
            border-radius: 40px;
            font-size: 1.2rem;
            color: white;
            margin-top: 20px;
            cursor: pointer;
        }

        .victory-text { color: #ffd700; font-size: 2rem; }
        .defeat-text { color: #e74c3c; font-size: 2rem; }
    </style>
</head>
<body>
<canvas id="gameCanvas"></canvas>

<div class="ui-overlay">
    <div class="joystick-area" id="joystickArea">
        <div style="width:100%;height:100%;border-radius:50%;background:rgba(255,255,255,0.2);border:2px solid rgba(255,255,255,0.5);"></div>
        <div id="joystickKnob" style="position:absolute;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,0.6);top:45px;left:45px;transition:0.02s;"></div>
    </div>
    
    <div class="right-buttons">
        <div class="action-btn" id="shootBtn">🔫</div>
        <div class="action-btn" id="jumpBtn">🦘</div>
    </div>
</div>

<div class="health-bars">
    <div class="health-item">
        <div class="health-name">🔵 蓝方</div>
        <div class="health-bar-bg"><div class="health-bar-fill blue-fill" id="blueHealthFill" style="width:100%"></div></div>
        <div class="health-lives" id="blueLives">❤️ x 3</div>
    </div>
    <div class="health-item">
        <div class="health-name">🔴 红方</div>
        <div class="health-bar-bg"><div class="health-bar-fill red-fill" id="redHealthFill" style="width:100%"></div></div>
        <div class="health-lives" id="redLives">❤️ x 3</div>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/platform.js"></script>
<script src="/js/player.js"></script>
<script src="/js/bullet.js"></script>
<script src="/js/game.js"></script>
</body>
</html>
